enable:
  issues: true
  prs: true

comments:
  issues: |
    Thanks for opening this issue on Cubosaurus-Tim! 🦖
    I have applied any labels matching special text in your title and description.

    Please review the labels and make any necessary changes.
  prs: |
    Thanks for contributing to Cubosaurus-Tim! 🧊
    I have applied any labels matching special text in your title and description.

    Please review the labels and make any necessary changes.

labels:
  'bug':
    include:
      - '\bbug[s]?\b'
    exclude: []
    branches:
      - 'main'
  'help wanted':
    include:
      - '\bhelp( me)?\b'
    exclude:
      - '\b\[test(ing)?\]\b'
  'enhancement':
    include:
      - '\bfeat\b'
    exclude: []
