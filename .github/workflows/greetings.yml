name: Greetings

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            Welcome to Cubosaurus-Tim! 🦖🧊

            Thanks for opening your first issue. Tim's anomaly is delicate —
            please make sure you've described the symptom clearly (what you see
            vs. what you expect). A maintainer will take a look soon.
          pr-message: >
            Welcome to Cubosaurus-Tim! 🦖🧊

            Thanks for your first pull request! Tim is watching nervously.
            Please make sure the regular CI is passing and your PR description
            links to the issue it fixes (e.g. "Fixes #3"). A maintainer will
            review it shortly.
